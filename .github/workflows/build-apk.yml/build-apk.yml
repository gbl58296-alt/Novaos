
name: Build NovaOS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip PocketDesktop-Android-Project.zip -d projeto

      - name: Compilar APK
        run: gradle -p projeto assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
